
services:
  postgres:
    image: postgres:17-alpine
    container_name: verzel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: verzel
      POSTGRES_PASSWORD: verzel_dev
      POSTGRES_DB: verzel_auction

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verzel -d verzel_auction"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    build: .
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://verzel:verzel_dev@postgres:5432/verzel_auction
      SEED_AUCTIONEER_PASSWORD: ${SEED_AUCTIONEER_PASSWORD:-}
      SEED_BIDDER1_PASSWORD: ${SEED_BIDDER1_PASSWORD:-}
      SEED_BIDDER2_PASSWORD: ${SEED_BIDDER2_PASSWORD:-}
    command: ["npm", "run", "db:seed"]

volumes:
  postgres_data:
