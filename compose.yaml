
services:
  postgres:
    image: postgres:17-alpine
    container_name: verzel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: verzel
      POSTGRES_PASSWORD: verzel_dev
      POSTGRES_DB: verzel_auction

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verzel -d verzel_auction"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
